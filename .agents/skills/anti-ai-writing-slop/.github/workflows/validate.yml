name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile the linter
        run: python -m py_compile scripts/lint_draft.py scripts/package_skill.py
      - name: Install the Agent Skills validator
        run: >-
          python -m pip install
          "git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"
      - name: Validate the Agent Skills package
        run: skills-ref validate "$GITHUB_WORKSPACE"
      - name: Run tests
        run: python -m unittest discover -s tests -v
