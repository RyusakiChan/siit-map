name = "siit-map-ask"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# No key here. The owner stores it as a secret:  npx wrangler secret put ANTHROPIC_API_KEY
# With no key the Worker runs in mock mode (canned answers).

# Per-IP rate limit: 30 requests a minute (campus Wi-Fi shares one IP). The owner can change the numbers.
[[ratelimits]]
name = "MINUTE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60

# Daily cap: 100 questions a day per IP, counted in this KV namespace (created with
#   npx wrangler kv namespace create DAILY). The limit itself is DAILY_LIMIT in src/index.ts.
[[kv_namespaces]]
binding = "DAILY"
id = "0b6bf257c7104647a8fcc5e8c5a3bbf5"
